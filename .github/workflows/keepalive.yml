# Supabase 免費版 7 天沒人用會自動暫停。每天自動連一次，讓專案保持開著。
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 1 * * *'   # 每天台灣時間 09:17
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://fczxrzzhuoxdohtlxkas.supabase.co/rest/v1/entries?select=id&limit=1" \
            -H "apikey: sb_publishable_LOv24p-cWryUSfD5A4nkMg_zG8BhpI7")
          echo "Supabase responded $code"
          test "$code" = "200"

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>祝福大螢幕</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap">
<style>
  html, body { height: 100%; overflow: hidden; cursor: none; }
  body.awake { cursor: url('deco/paw-cursor.png') 16 16, default; }   /* 滑鼠動的時候才出現貓掌游標 */
  body:not(.awake) .paw-cursor-el { opacity: 0; }   /* 滑鼠停著不動就把貓掌游標藏起來 */

  .stage { position: fixed; inset: 0; z-index: 1; display: grid; grid-template-rows: 12vh minmax(0, 1fr) 15vh 1vh; justify-items: center; }
  .heading { align-self: end; text-align: center; padding-bottom: 2vh; }
  .heading .names { font-size: 6.5vh; margin: 0; }

  /* 畫框區：每則祝福輪流換一個畫框素材（frames/frames.json） */
  /* --frame-scale：所有畫框的整體大小 */
  .frame { --frame-scale: .96; position: relative; width: 72vw; height: 100%; min-height: 0; align-self: stretch; }
  .slot { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity 1.1s ease; }
  .slot.on { opacity: 1; }
  .fbox { position: relative; height: 100%; max-width: 100%; filter: drop-shadow(0 1.2vh 2vh rgba(60,15,10,.35)); }
  .fbox .fimg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .win { position: absolute; overflow: hidden; background: #1d0f0d; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
  .win .bg { position: absolute; inset: -40px; background: center / cover no-repeat; filter: blur(24px) brightness(.6) saturate(1.1); }
  .win img, .win video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  /* 照片：畫框先放大登場，再縮小讓出名字和祝福 */
  .slot.photo .fbox { transform: scale(1.05); transition: transform 1.3s cubic-bezier(.6,0,.2,1); }
  .slot.photo.settled .fbox { transform: scale(.86) translateY(-3%); }
  body.showing-photo .caption { translate: 0 -5vh; }

  /* 名字區固定高度，畫框才不會因為有沒有留言而上下跳 */
  .caption { align-self: start; margin-top: .6vh; max-width: 64vw; text-align: center; transition: opacity .8s, translate 1.3s cubic-bezier(.6,0,.2,1); }
  .caption.fade { opacity: 0; }
  .caption .who { font: 5.2vh/1.25 'LXGW WenKai TC', var(--zh); margin: 0; letter-spacing: .06em; }
  .caption .msg { font: 3vh/1.5 'LXGW WenKai TC', var(--zh); color: var(--wine-soft); margin: .6vh 0 0; letter-spacing: .06em; }
  .caption .msg:empty { display: none; }

  .qr-card { position: fixed; right: 2.4vw; bottom: 3vh; z-index: 30; width: 13vh; padding: 1vh 1vh .7vh; text-align: center;
    background: var(--paper); border-radius: 2px; box-shadow: 0 0 0 1px var(--wine), 0 .8vh 2vh rgba(40,0,0,.35); }
  .qr-card svg, .qr-card img { width: 100%; height: auto; display: block; }
  .qr-card p { margin: .5vh 0 0; font: 600 1.35vh var(--zh); }

  .idle { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 2.4vh; text-align: center; transition: opacity 1s; }
  .idle .qr { width: 24vh; padding: 1.4vh; background: #fff; box-shadow: 0 0 0 1px var(--wine); }
  .idle .qr svg, .idle .qr img { width: 100%; height: auto; display: block; }
  .idle p { margin: 0; font-size: 2.8vh; letter-spacing: .12em; }

  /* 沒登入時的擋門畫面 */
  .gate { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 2vh; text-align: center; padding: 24px; }
  .gate h1 { margin: 0; font-size: clamp(2.6rem, 8vh, 4.5rem); }
  .gate p { margin: 0; font-size: 1.1rem; color: var(--wine-soft); }
  .gate .plaque { width: auto; padding: 14px 28px; }
  body:has(.gate) { cursor: auto; }

  #drape { z-index: 20; }

  /* 隨機插圖裝飾（蝴蝶結、貓咪），每換一則重新擺 */
  /* 換場時先收起來 */
  .deco { position: fixed; inset: 0; z-index: 3; pointer-events: none; transition: opacity .4s; }
  .deco.away { opacity: 0; }
  .deco img { position: absolute; height: var(--h); rotate: var(--r); opacity: 0;
    filter: drop-shadow(0 .6vh .8vh rgba(80,20,10,.15));
    animation: deco-in .9s cubic-bezier(.3,1.4,.5,1) var(--d) forwards, deco-float 6s ease-in-out calc(var(--d) + .9s) infinite alternate; }
  @keyframes deco-in { from { opacity: 0; scale: .4; } to { opacity: 1; scale: 1; } }
  @keyframes deco-float { from { translate: 0 0; } to { translate: 0 -1.4vh; } }

  /* 過場：布幕關上時浮現下一位賓客名字 */
  .intermission { position: fixed; inset: 0; z-index: 22; display: grid; place-content: center; pointer-events: none;
    font: 7vh/1.3 'LXGW WenKai TC', var(--zh); letter-spacing: .1em; color: var(--cream); text-shadow: 0 .4vh 2vh rgba(40,0,0,.5);
    opacity: 0; transform: translateY(1.5vh); transition: opacity .5s, transform .5s; }
  .intermission.show { opacity: 1; transform: none; }

  /* 過場：畫框退場／掛上牆 */
  body[data-fx="hang"] .slot { transition: none; }
  .slot.leave .fbox { animation: frame-leave .65s ease-in forwards; }
  .slot.enter .fbox { animation: frame-hang 1.5s cubic-bezier(.2,.9,.3,1) both; transform-origin: 50% 0; }
  @keyframes frame-leave { to { opacity: 0; transform: scale(.82) translateY(2vh); } }
  @keyframes frame-hang {
    0% { opacity: 0; transform: translateY(-60vh) rotate(-3deg); }
    45% { opacity: 1; transform: translateY(0) rotate(2.4deg); }
    65% { transform: rotate(-1.4deg); }
    82% { transform: rotate(.6deg); }
    100% { transform: none; }
  }

  /* 過場：聚光燈收合再打開 */
  .spot { position: fixed; left: 50%; top: 48%; z-index: 19; width: 260vmax; height: 260vmax; border-radius: 50%;
    translate: -50% -50%; pointer-events: none; box-shadow: 0 0 0 200vmax rgba(18,4,3,.94), inset 0 0 8vmax 4vmax rgba(18,4,3,.94);
    transition: width 1s cubic-bezier(.6,0,.3,1), height 1s cubic-bezier(.6,0,.3,1); }
  .spot.shut { width: 0; height: 0; }
  .start { position: fixed; inset: 0; z-index: 60; display: grid; place-content: center; gap: 2vh; text-align: center; cursor: url('deco/paw-cursor.png') 16 16, pointer; background: none; border: 0; color: var(--cream); font: inherit; transition: opacity .8s; }
  .start .names { font-size: 12vh; margin: 0; text-shadow: 0 .4vh 2vh rgba(40,0,0,.5); }
  .start p { margin: 0; font-size: 2.4vh; letter-spacing: .4em; animation: breathe 2.4s ease-in-out infinite; }
  .start.gone { opacity: 0; pointer-events: none; }
  @keyframes breathe { 50% { opacity: .35; } }
  .count-badge { position: fixed; left: 2.4vw; bottom: 3vh; z-index: 21; font: 1.6vh var(--serif); color: var(--cream); opacity: 0; transition: opacity .4s; }
  body.awake .count-badge { opacity: .9; }
</style>
</head>
<body>
<div class="deco" id="deco" aria-hidden="true"></div>
<div class="stage">
  <div class="heading"><h1 class="names script" data-couple></h1></div>
  <div class="frame" id="frame">
    <div class="idle" id="idle">
      <div class="qr" data-qr></div>
      <p>掃描 QR code，留下第一則祝福</p>
    </div>
    <div class="slot" id="slotA"></div>
    <div class="slot" id="slotB"></div>
  </div>
  <div class="caption fade" id="card"><p class="who" id="who"></p><p class="msg" id="msg"></p></div>
</div>

<div class="qr-card" id="qr-card" hidden><div data-qr></div><p>掃我留下祝福</p></div>
<div class="count-badge" id="count"></div>

<div class="spot" id="spot" aria-hidden="true"></div>
<div class="drape-host" id="drape" aria-hidden="true"></div>
<div class="intermission" id="intermission" aria-hidden="true"></div>
<button class="start" id="start">
  <h1 class="names script" data-couple></h1>
  <p>點一下開幕</p>
</button>
<audio id="music" loop preload="auto"></audio>

<script src="vendor/qrcode-generator-1.4.4.js"></script>
<script type="module" src="js/screen.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>祝福大螢幕</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  html, body { height: 100%; overflow: hidden; cursor: none; }
  body.awake { cursor: default; }

  .stage { position: fixed; inset: 0; display: grid; grid-template-rows: 19vh 1fr auto 4vh; justify-items: center; }
  .tieback { position: fixed; top: 0; bottom: 0; width: 11vw; z-index: 5; box-shadow: 0 0 40px rgba(0,0,0,.8); }
  .tieback.left { left: 0; clip-path: polygon(0 0, 100% 0, 55% 52%, 100% 100%, 0 100%); }
  .tieback.right { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 45% 52%); }
  .rope { position: fixed; top: 51%; z-index: 6; width: 7vw; height: 1.4vh; border-radius: 99px;
    background: linear-gradient(#f0d68f, #8a5f22); box-shadow: 0 3px 8px rgba(0,0,0,.6); }
  .rope.left { left: 1vw; transform: rotate(-8deg); }
  .rope.right { right: 1vw; transform: rotate(8deg); }
  .top-valance { position: fixed; top: 0; left: 0; right: 0; height: 9vh; z-index: 7;
    -webkit-mask: radial-gradient(5vw 3vh at 5vw 100%, transparent 98%, #000) 0 0 / 10vw 100%;
            mask: radial-gradient(5vw 3vh at 5vw 100%, transparent 98%, #000) 0 0 / 10vw 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,.7); }
  .top-valance::after { content: ''; position: absolute; left: 0; right: 0; top: 1.4vh; height: .45vh;
    background: linear-gradient(90deg, #8a5f22, var(--gold-lit), #8a5f22); }

  .heading { align-self: end; text-align: center; padding-bottom: 1.2vh; z-index: 8; }
  .heading .names { font-size: 7vh; margin: 0; }

  .frame { width: min(64vw, calc((100vh - 19vh - 17vh - 6vh) * 16 / 9)); aspect-ratio: 16 / 9; align-self: center; background: #0d0103; }
  .frame .corner { width: 11vh; height: 11vh; top: auto; left: auto; right: auto; bottom: auto; }
  .frame .corner.tl { top: -2vh; left: -2vh; } .frame .corner.tr { top: -2vh; right: -2vh; }
  .frame .corner.bl { bottom: -2vh; left: -2vh; } .frame .corner.br { bottom: -2vh; right: -2vh; }
  .slot { position: absolute; inset: 1.1vh; overflow: hidden; opacity: 0; transition: opacity 1.1s ease; }
  .slot.on { opacity: 1; }
  .slot .bg { position: absolute; inset: -40px; background: center / cover no-repeat; filter: blur(28px) brightness(.45) saturate(1.2); }
  .slot img, .slot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  .plaque-card { margin-top: 3.2vh; min-width: 34vw; max-width: 62vw; padding: 1.4vh 4vw 1.8vh; text-align: center;
    background: linear-gradient(170deg, #f7e6ae 0%, #d8ac58 38%, #a9772f 62%, #e9c874 100%);
    color: var(--ink); border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,248,220,.7), inset 0 0 0 .5vh rgba(120,80,20,.35), 0 1vh 3vh rgba(0,0,0,.6);
    transition: opacity .8s; }
  .plaque-card.fade { opacity: 0; }
  .plaque-card .who { font: 600 4.2vh/1.2 'Pinyon Script', 'Noto Serif TC', serif; margin: 0; }
  .plaque-card .msg { font: 600 2.5vh/1.5 var(--zh); margin: .4vh 0 0; letter-spacing: .04em; }
  .plaque-card .msg:empty { display: none; }

  .qr-card { position: fixed; right: 1.6vw; bottom: 2.4vh; z-index: 9; width: 13vh; padding: 1vh 1vh .6vh; text-align: center;
    background: var(--ivory); color: var(--ink); border-radius: 3px; box-shadow: 0 0 0 2px var(--gold), 0 8px 20px rgba(0,0,0,.6); }
  .qr-card svg, .qr-card img { width: 100%; height: auto; display: block; }
  .qr-card p { margin: .5vh 0 0; font: 600 1.35vh var(--zh); }

  .idle { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 2vh; text-align: center; transition: opacity 1s; }
  .idle .qr { width: 26vh; background: var(--ivory); padding: 1.4vh; box-shadow: 0 0 0 3px var(--gold); }
  .idle .qr svg, .idle .qr img { width: 100%; height: auto; display: block; }
  .idle p { margin: 0; font-size: 2.8vh; letter-spacing: .1em; }

  .curtain .panel { transition-duration: 3.2s; }
  .start { position: fixed; inset: 0; z-index: 60; display: grid; place-content: center; gap: 2vh; text-align: center; cursor: pointer; background: none; border: 0; color: inherit; font: inherit; }
  .start .names { font-size: 11vh; margin: 0; }
  .start p { margin: 0; font-size: 2.4vh; letter-spacing: .3em; color: var(--gold-lit); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  .count-badge { position: fixed; left: 1.6vw; bottom: 2.4vh; z-index: 9; font: 1.6vh var(--serif); color: var(--gold); opacity: 0; transition: opacity .4s; }
  body.awake .count-badge { opacity: .8; }
</style>
</head>
<body>
<div class="top-valance drape"></div>
<div class="tieback left drape"></div><div class="tieback right drape"></div>
<div class="rope left"></div><div class="rope right"></div>

<div class="stage">
  <div class="heading"><h1 class="names script gold-text" data-couple></h1></div>
  <div class="frame gilt" id="frame">
    <div class="idle" id="idle">
      <div class="qr" data-qr></div>
      <p class="gold-text">掃描 QR code，留下第一則祝福</p>
    </div>
    <div class="slot" id="slotA"></div>
    <div class="slot" id="slotB"></div>
  </div>
  <div class="plaque-card fade" id="card"><p class="who" id="who"></p><p class="msg" id="msg"></p></div>
</div>

<div class="qr-card" id="qr-card" hidden><div data-qr></div><p>掃我留下祝福</p></div>
<div class="count-badge" id="count"></div>

<div class="curtain" id="curtain" aria-hidden="true">
  <div class="valance drape"></div>
  <div class="panel left drape"></div>
  <div class="panel right drape"></div>
</div>
<button class="start" id="start">
  <h1 class="names script gold-text" data-couple></h1>
  <p>點一下開幕</p>
</button>
<audio id="music" loop preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module" src="js/screen.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a1c17">
<title>為新人留下祝福</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  /* 首頁布幕只蓋第一個畫面，拉開後留在兩側；離開首頁就淡出 */
  #drape { position: absolute; height: 100svh; z-index: 0; transition: opacity .5s; }
  main { position: relative; z-index: 1; opacity: 0; transition: opacity 1s ease; }
  body.revealed main { opacity: 1; }
  body:not(.at-home) #drape { opacity: 0; }
  main { max-width: 460px; margin: 0 auto; padding: 64px 20px calc(48px + env(safe-area-inset-bottom)); text-align: center; }
  body.at-home main { padding-top: 25svh; }
  section { animation: rise .6s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .masthead { margin: 0 0 26px; }
  .kicker { font: 600 .82rem/1.6 var(--zh); letter-spacing: .3em; margin: 0; }
  .masthead .names { font-size: clamp(3rem, 15vw, 4.2rem); margin: 10px 0 0; }
  .masthead .date { font: italic 500 1.15rem var(--serif); font-variant-numeric: lining-nums; letter-spacing: .25em; margin: 8px 0 0; }
  .invite { font-size: 1rem; line-height: 1.9; margin: 0 auto 26px; max-width: 16em; color: var(--wine-soft); }
  .actions { display: grid; gap: 12px; max-width: 260px; margin: 0 auto; }
  .alt { margin-top: 14px; font-size: .92rem; color: var(--wine-soft); }

  .viewer { aspect-ratio: 3 / 4; margin: 10px 6px 20px; background: #1d0f0d; }
  .viewer video, .viewer img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .viewer video.mirror { transform: scaleX(-1); }
  .timer {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 2;
    padding: 4px 14px; border-radius: 999px; font: 600 1.1rem var(--serif);
    background: rgba(247,240,230,.9); color: var(--wine);
  }
  .timer.live::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: var(--brick); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .flip {
    position: absolute; right: 14px; bottom: 14px; z-index: 2; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: rgba(247,240,230,.9); color: var(--wine); font-size: 1.2rem; cursor: pointer;
  }
  .rec-row { display: flex; align-items: center; justify-content: center; gap: 28px; }
  .rec-btn {
    width: 76px; height: 76px; border-radius: 50%; cursor: pointer; border: 0;
    background: radial-gradient(circle, var(--brick) 0 44%, var(--paper) 45% 55%, var(--wine) 56%);
    box-shadow: 0 4px 14px rgba(110,27,23,.35);
  }
  .rec-btn.stop { background: linear-gradient(var(--brick), var(--brick)) center / 26px 26px no-repeat, radial-gradient(circle, var(--paper) 0 55%, var(--wine) 56%); }
  .hint { font-size: .9rem; color: var(--wine-soft); margin: 14px 0 0; }
  .two { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }

  form { text-align: left; }
  .thumb { width: 42%; aspect-ratio: 3/4; margin: 10px auto 14px; background: #1d0f0d; }
  .thumb > video, .thumb > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .count { float: right; font-size: .8rem; color: var(--wine-soft); }
  form .plaque { margin-top: 26px; }

  .progress { height: 8px; margin: 24px 0 10px; background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--line); }
  .progress > div { height: 100%; width: 0; background: var(--brick); transition: width .2s; }
  .big { font-size: 1.3rem; margin: 10vh 0 6px; }

  .thanks { font-size: clamp(3rem, 15vw, 4rem); margin: 4vh 0 6px; }
  .ig { display: grid; gap: 10px; margin-bottom: 14px; }
  .ig-tip { margin: 0; font-size: .9rem; line-height: 1.7; color: var(--wine-soft); }
  .ig-tip b { color: var(--wine); font-weight: 600; user-select: all; }
  .error { color: var(--brick-deep); background: #f6dcd6; border: 1px solid rgba(138,28,23,.4); padding: 10px 14px; margin: 16px 0 0; font-size: .95rem; text-align: left; }

  .petal { position: fixed; top: -30px; z-index: 30; width: 12px; height: 15px; pointer-events: none;
    background: var(--brick); border-radius: 60% 0 60% 0; animation: fall linear forwards; }
  .petal:nth-child(3n) { background: var(--cream); box-shadow: inset 0 0 0 1px var(--line); }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); opacity: .3; } }
</style>
</head>
<body class="at-home">
<div class="drape-host" id="drape" aria-hidden="true"></div>

<main>
  <!-- 首頁 -->
  <section id="s-home">
    <header class="masthead">
      <p class="kicker">為我們留下一段祝福</p>
      <h1 class="names script" data-couple></h1>
      <p class="date" data-date></p>
    </header>
    <p class="invite">影片最長 60 秒<br>新人確認後，會在會場大螢幕播出</p>
    <div class="actions">
      <button class="plaque" id="go-video">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>
        錄一段祝福影片</button>
      <button class="plaque" id="go-photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
        拍一張照片</button>
    </div>
    <p class="alt">已經拍好了？<button class="link" id="pick-video">從相簿選影片</button></p>
    <input type="file" id="file-photo" accept="image/*" hidden>
    <input type="file" id="file-video" accept="video/*" hidden>
  </section>

  <!-- 錄影 -->
  <section id="s-record" hidden>
    <div class="viewer gilt">
      <video id="cam" class="mirror" playsinline muted autoplay></video>
      <span class="timer" id="timer">0:60</span>
      <button class="flip" id="flip" aria-label="切換前後鏡頭">⟲</button>
    </div>
    <div class="rec-row">
      <button class="link" id="rec-cancel">取消</button>
      <button class="rec-btn" id="rec-btn" aria-label="開始錄影"></button>
      <span style="width:52px"></span>
    </div>
    <p class="hint" id="rec-hint">按下紅色按鈕開始錄，最長 60 秒</p>
    <p class="error" id="cam-error" hidden></p>
  </section>

  <!-- 錄完預覽 -->
  <section id="s-review" hidden>
    <div class="viewer gilt"><video id="review" playsinline controls></video></div>
    <div class="two">
      <button class="plaque ghost" id="redo">重錄</button>
      <button class="plaque" id="use">用這段</button>
    </div>
  </section>

  <!-- 填名字 -->
  <section id="s-details" hidden>
    <div class="thumb gilt" id="thumb"></div>
    <form id="form" novalidate>
      <label for="name">你的名字</label>
      <input id="name" maxlength="20" autocomplete="name" placeholder="例如：大學室友 阿明" required>
      <label for="msg">想對新人說的話 <span class="count" id="count">0 / 60</span></label>
      <textarea id="msg" rows="3" maxlength="60" placeholder="選填，會顯示在大螢幕上"></textarea>
      <p class="error" id="form-error" hidden></p>
      <button class="plaque" type="submit" id="send">送出祝福</button>
      <p style="text-align:center"><button class="link" type="button" id="back-home">重新選擇</button></p>
    </form>
  </section>

  <!-- 上傳中 -->
  <section id="s-sending" hidden>
    <p class="big">正在送出你的祝福…</p>
    <div class="progress"><div id="bar"></div></div>
    <p class="hint">請先不要關掉這個畫面</p>
  </section>

  <!-- 完成 -->
  <section id="s-done" hidden>
    <h2 class="thanks script">Thank you</h2>
    <p class="invite">祝福收到了，新人確認後就會出現在大螢幕上</p>
    <div class="ig" id="ig">
      <button class="plaque" id="share-ig">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor"/></svg>
        也分享到我的 IG 限動</button>
      <a class="plaque" id="save-file" download hidden>存到手機，再自己發 IG</a>
      <p class="ig-tip" id="ig-tip"></p>
    </div>
    <button class="plaque ghost" id="again">再留一則祝福</button>
  </section>
</main>

<script type="module" src="js/guest.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a1c17">
<title>為新人留下祝福</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap">
<style>
  /* 首頁布幕只蓋第一個畫面，拉開後留在兩側；離開首頁就淡出 */
  #drape { position: absolute; height: 100svh; z-index: 0; transition: opacity .5s; }
  main { position: relative; z-index: 1; opacity: 0; transition: opacity 1s ease; }
  body.revealed main { opacity: 1; }
  body:not(.at-home) #drape { opacity: 0; }
  main { max-width: 460px; margin: 0 auto; padding: 64px 20px calc(48px + env(safe-area-inset-bottom)); text-align: center; }
  body.at-home main { padding-top: 19svh; }   /* 手機 */
  /* 平板、電腦：文字往下一點 */
  @media (min-width: 700px) { body.at-home.mode-record main { padding-top: 28svh; } }
  /* 矮的手機：內容往上收，按鈕才不會掉到畫面外 */
  @media (max-height: 700px) {
    body.at-home.mode-record main { padding-top: 12svh; }
    body.mode-record .masthead { margin-bottom: 14px; }
    body.mode-record .invite { margin-bottom: 16px; line-height: 1.7; }
  }
  section { animation: rise .6s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .masthead { margin: 0 0 26px; }
  .kicker { font: 600 1rem/1.6 var(--zh); letter-spacing: .28em; margin: 0; }
  .masthead .names { font-size: clamp(3rem, 15vw, 4.2rem); margin: 10px 0 0; }
  .masthead .date { font: italic 500 1.15rem var(--serif); font-variant-numeric: lining-nums; letter-spacing: .25em; margin: 8px 0 0; }
  .invite { font-size: 1rem; line-height: 1.9; margin: 0 auto 26px; max-width: 16em; color: var(--wine-soft); }
  .actions { display: grid; gap: 12px; max-width: 260px; margin: 0 auto; }
  .alt { margin: 14px auto 0; font-size: .92rem; color: var(--wine-soft); }

  .viewer { aspect-ratio: 4 / 5; margin: 10px 6px 20px; background: #1d0f0d; }
  .viewer video, .viewer img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .viewer video.mirror { transform: scaleX(-1); }

  /* 取景框、預覽框用畫框素材（frames/）；.win 是畫框挖空的位置，固定 4:5 */
  .pframe { position: relative; background: none; }
  /* 取景框：左右各留一點邊 */
  .viewer.pframe { margin: 0 -4px 16px; }
  body:not(.at-home) main { padding-top: 22px; max-width: 540px; }
  .pframe .win { position: absolute; overflow: hidden; background: #1d0f0d; }
  .pframe .win video, .pframe .win img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pframe .pf-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none;
    filter: drop-shadow(0 6px 10px rgba(60,15,10,.3)); }
  .timer {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 2;
    padding: 4px 14px; border-radius: 999px; font: 600 1.1rem var(--serif);
    background: rgba(247,240,230,.9); color: var(--wine);
  }
  .timer.live::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: var(--brick); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .flip {
    position: absolute; right: 14px; bottom: 14px; z-index: 2; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: rgba(247,240,230,.9); color: var(--wine); font-size: 1.2rem; cursor: pointer;
  }
  /* 畫框下方隨機出現的小插圖 */
  .minis { display: none;   /* 先不顯示；要開回來把 none 改成 flex */
    justify-content: space-around; align-items: center; height: 96px; margin-top: 14px; pointer-events: none; }
  .minis img { height: var(--h); rotate: var(--r); translate: 0 var(--y); opacity: 0; animation: mini-in .7s cubic-bezier(.3,1.4,.5,1) var(--d) forwards; }
  @keyframes mini-in { from { opacity: 0; scale: .4; } to { opacity: 1; scale: 1; } }
  .rec-row { display: flex; align-items: center; justify-content: center; gap: 28px; }
  .rec-btn {
    width: 76px; height: 76px; border-radius: 50%; cursor: pointer; border: 0;
    background: radial-gradient(circle, var(--brick) 0 44%, var(--paper) 45% 55%, var(--wine) 56%);
    box-shadow: 0 4px 14px rgba(110,27,23,.35);
  }
  /* 拍照模式：白色快門 */
  .rec-btn.shutter { background: radial-gradient(circle, #fff 0 44%, var(--paper) 45% 55%, var(--wine) 56%); }
  .rec-btn.shutter:active { transform: scale(.94); }
  .flash { position: absolute; inset: 0; z-index: 3; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .45s ease-out; }
  @keyframes flash { from { opacity: .9; } to { opacity: 0; } }
  .rec-btn.stop { background: linear-gradient(var(--brick), var(--brick)) center / 26px 26px no-repeat, radial-gradient(circle, var(--paper) 0 55%, var(--wine) 56%); }
  .hint { font-size: .9rem; color: var(--wine-soft); margin: 14px 0 0; }
  .two { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }

  form { text-align: left; }
  .thumb { width: 42%; aspect-ratio: 4 / 5; margin: 10px auto 14px; background: #1d0f0d; }
  .thumb > video, .thumb > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .count { float: right; font-size: .8rem; color: var(--wine-soft); }
  form .plaque { margin-top: 26px; }

  .progress { height: 8px; margin: 24px 0 10px; background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--line); }
  .progress > div { height: 100%; width: 0; background: var(--brick); transition: width .2s; }
  .big { font-size: 1.3rem; margin: 10vh 0 6px; }

  .thanks { font-size: clamp(3rem, 15vw, 4rem); margin: 4vh 0 6px; }
  .ig { display: grid; gap: 10px; margin-bottom: 14px; }
  .ig-tip { margin: 0; font-size: .9rem; line-height: 1.7; color: var(--wine-soft); }
  .ig-tip b { color: var(--wine); font-weight: 600; user-select: all; }
  .error { color: var(--brick-deep); background: #f6dcd6; border: 1px solid rgba(138,28,23,.4); padding: 10px 14px; margin: 16px 0 0; font-size: .95rem; text-align: left; }

  /* ---------- 展示首頁：斜斜的膠卷牆，用 film/strip.png 素材，一直流動 ---------- */
  html, body { overflow-x: clip; }
  .alt-q { display: none; }   /* 會被布幕蓋到，先收起來 */
  /* 膠卷展示頁（?wall）不放錄影拍照按鈕 */
  body.mode-show .actions, body.mode-show .alt { display: none; }
  body.mode-show.has-film .invite { display: none; }
  body.has-film.at-home main { padding-top: 0; padding-bottom: 0; max-width: none; height: 100svh; overflow: hidden; display: flex; flex-direction: column; }
  body.has-film.at-home #s-home { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  body.has-film .masthead { display: none; }   /* 膠卷頁不放標題，整個畫面都是膠卷 */
  body.has-film .masthead .names { font-size: clamp(2.2rem, 11vw, 3rem); margin-top: 4px; }
  body.has-film .masthead .date { font-size: .95rem; margin-top: 2px; }
  /* 有膠卷時布幕再往兩邊拉開一點，讓出中間的位置 */
  #drape { transform-origin: 50% 0; transition: opacity .5s, transform 1.2s cubic-bezier(.6,0,.2,1); }
  body.has-film #drape { opacity: 0; transition: opacity 1.2s ease .6s; }   /* 膠卷頁不留布幕，開場拉開後淡出 */

  .filmwall { position: relative; flex: 1; min-height: 0; margin: 0 -20px; overflow: hidden; }
  .reels { position: absolute; left: 50%; top: 50%; width: 190%; height: 190%; translate: -50% -50%; rotate: -14deg;
    display: flex; justify-content: center; gap: 0; }
  /* 寬螢幕：兩條一樣大、緊貼在一起，左右留白 */
  .reel { flex: none; width: 28vw; max-width: 370px; }
  /* 手機：只留中間那一條，左右留白 */
  @media (max-width: 699px) {
    .reel { width: 70vw; max-width: 330px; }
    .reel:nth-child(1) { display: none; }
    .reels { rotate: -9deg; }
  }
  .reel-track { display: flex; flex-direction: column; animation: flow var(--dur, 60s) linear infinite; will-change: transform; }
  .reel:nth-child(even) .reel-track { animation-direction: reverse; }
  .reels.paused .reel-track { animation-play-state: paused; }
  @keyframes flow { to { transform: translateY(-50%); } }
  .tile { position: relative; flex: none; }
  .tile .strip { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .slot { position: absolute; overflow: hidden; background: #2a1512; cursor: pointer; border: 0; padding: 0; }
  .slot img, .slot video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 影片格：3 個畫面疊在一起輪流顯示，像動圖 */
  .slot img.gif { position: absolute; inset: 0; }
  .slot img.gif.f1, .slot img.gif.f2 { opacity: 0; animation: gif3 1.5s steps(1) infinite; }
  .slot img.gif.f1 { animation-delay: -.5s; }   /* 第 2 格：0.5～1 秒 */
  .slot img.gif.f2 { animation-delay: 0s; }     /* 第 3 格：1～1.5 秒 */
  @keyframes gif3 { 0% { opacity: 0; } 66.7% { opacity: 1; } 100% { opacity: 0; } }
  .reels.paused .slot img.gif { animation-play-state: paused; }
  /* 上傳時做好的三格縮圖：一張圖橫排三格，輪流顯示 */
  .slot .sprite3 { position: absolute; inset: 0; background-size: 300% 100%; background-position: 0 0;
    animation: sprite3 1.5s steps(3, jump-none) infinite; }
  @keyframes sprite3 { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  .reels.paused .slot .sprite3 { animation-play-state: paused; }
  /* 還沒有祝福時的空格子 */
  .slot.empty { background: var(--paper); display: grid; place-items: center; }
  .slot.empty span { font: 1.05rem/1.7 'LXGW WenKai TC', var(--zh); letter-spacing: .12em; color: var(--wine-soft); text-align: center; }
  .slot .tag { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 6px; text-align: center;
    font: .78rem/1.3 'LXGW WenKai TC', var(--zh); letter-spacing: .05em; color: var(--cream);
    background: linear-gradient(transparent, rgba(30,8,6,.78)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot .vid { position: absolute; right: 7px; top: 7px; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(248,228,206,.9); color: var(--wine); font-size: .6rem; line-height: 22px; text-align: center; padding-left: 2px; }

  /* 小插圖當背景花紋：很淡、整齊鋪滿、不會動 */
  .film-deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; animation: rise 1.2s ease .6s both; }
  .film-deco img { position: absolute; opacity: .78; }
  .film-deco img.solid { opacity: .5; }   /* 深紅實心的圖比較重，再淡一點 */

  /* 展示頁左上角的「我也要留祝福」小標籤，回到錄影拍照頁 */
  .wall-btn { position: fixed; z-index: 50; left: 14px; top: calc(14px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 3px; text-decoration: none;
    font: 600 .9rem var(--zh); letter-spacing: .1em; color: var(--wine); background: rgba(247,240,230,.94);
    box-shadow: inset 0 0 0 1px var(--wine), 0 4px 12px rgba(60,15,10,.2); animation: rise .6s ease 1.8s both; }
  .wall-btn svg { width: 1.3em; height: 1.3em; flex: none; }

  /* 點一格放大看：影片可播放，下面是名字和留言 */
  .lightbox { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px;
    background: rgba(46,10,8,.86); animation: rise .3s ease both; }
  .lightbox .card { width: min(88vw, 400px); background: var(--paper); padding: 12px 12px 16px; border-radius: 3px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5); text-align: center; }
  .lightbox .media { aspect-ratio: 4 / 5; background: #1d0f0d; }
  .lightbox .media img, .lightbox .media video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .lightbox .who { margin: 12px 0 0; font: 1.25rem 'LXGW WenKai TC', var(--zh); letter-spacing: .06em; }
  .lightbox .msg { margin: 4px 0 0; font: .98rem/1.6 'LXGW WenKai TC', var(--zh); color: var(--wine-soft); }
  .lightbox .msg:empty { display: none; }
  .lightbox .close { margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) { .reel-track { animation: none; } }

  /* 在 IG／FB／LINE 內建瀏覽器打開時的提醒 */
  .inapp-tip { position: fixed; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 70;
    padding: 12px 40px 12px 14px; font-size: .9rem; line-height: 1.6; text-align: left;
    color: var(--paper); background: var(--wine); border-radius: 4px; box-shadow: 0 8px 20px rgba(40,10,5,.35); }
  .inapp-tip b { font-weight: 600; }
  .inapp-tip button { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border: 0; background: none; color: var(--paper); font-size: 1rem; }

  .petal { position: fixed; top: -30px; z-index: 30; width: 12px; height: 15px; pointer-events: none;
    background: var(--brick); border-radius: 60% 0 60% 0; animation: fall linear forwards; }
  .petal:nth-child(3n) { background: var(--cream); box-shadow: inset 0 0 0 1px var(--line); }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); opacity: .3; } }
</style>
</head>
<body class="at-home">
<div class="drape-host" id="drape" aria-hidden="true"></div>

<main>
  <!-- 首頁 -->
  <section id="s-home">
    <header class="masthead">
      <p class="kicker" id="kicker">為我們留下一段祝福</p>
      <h1 class="names script" data-couple></h1>
      <p class="date" data-date></p>
    </header>
    <p class="invite" id="invite">影片最長 60 秒，也可以拍照<br>新人確認後，會在會場大螢幕播出</p>
    <div class="filmwall" id="film" hidden aria-label="大家的祝福"><div class="film-deco" id="film-deco" aria-hidden="true"></div><div class="reels" id="reels"></div></div>
    <div class="actions">
      <button class="plaque" id="go-video">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>
        錄一段祝福影片</button>
      <button class="plaque" id="go-photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
        拍一張照片</button>
      <a class="plaque ghost" id="go-wall" href="./?wall">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2" width="14" height="20" rx="1.5"/><path d="M5 8h14M5 16h14"/><path d="M7.5 4.5v1M7.5 10.5v3M7.5 18.5v1M16.5 4.5v1M16.5 10.5v3M16.5 18.5v1"/></svg>
        大家的祝福</a>
    </div>
    <p class="alt"><span class="alt-q">已經拍好了？</span><button class="link" id="pick-file">從相簿選照片或影片</button></p>
    <input type="file" id="file-pick" accept="image/*,video/*" hidden>
  </section>

  <!-- 錄影 -->
  <section id="s-record" hidden>
    <div class="viewer">
      <video id="cam" class="mirror" playsinline muted autoplay></video>
      <div class="flash" id="flash"></div>
      <span class="timer" id="timer">0:60</span>
      <button class="flip" id="flip" aria-label="切換前後鏡頭">⟲</button>
    </div>
    <div class="rec-row">
      <button class="link" id="rec-cancel">取消</button>
      <button class="rec-btn" id="rec-btn" aria-label="開始錄影"></button>
      <span style="width:52px"></span>
    </div>
    <p class="hint" id="rec-hint">按下紅色按鈕開始錄，最長 60 秒</p>
    <p class="error" id="cam-error" hidden></p>
    <div class="minis" aria-hidden="true"></div>
  </section>

  <!-- 錄完預覽 -->
  <section id="s-review" hidden>
    <div class="viewer"><video id="review" playsinline controls></video><img id="review-img" alt="剛拍的照片" hidden></div>
    <div class="two">
      <button class="plaque ghost" id="redo">重錄</button>
      <button class="plaque" id="use">用這段</button>
    </div>
    <div class="minis" aria-hidden="true"></div>
  </section>

  <!-- 填名字 -->
  <section id="s-details" hidden>
    <div class="thumb" id="thumb"></div>
    <form id="form" novalidate>
      <label for="name">你的名字</label>
      <input id="name" maxlength="20" autocomplete="name" placeholder="例如：大學室友 阿明" required>
      <label for="msg">想對新人說的話 <span class="count" id="count">0 / 60</span></label>
      <textarea id="msg" rows="3" maxlength="60" placeholder="選填，會顯示在大螢幕上"></textarea>
      <p class="error" id="form-error" hidden></p>
      <button class="plaque" type="submit" id="send">送出祝福</button>
      <p style="text-align:center"><button class="link" type="button" id="back-home">重新選擇</button></p>
    </form>
  </section>

  <!-- 上傳中 -->
  <section id="s-sending" hidden>
    <p class="big">正在送出你的祝福…</p>
    <div class="progress"><div id="bar"></div></div>
    <p class="hint">請先不要關掉這個畫面</p>
  </section>

  <!-- 完成 -->
  <section id="s-done" hidden>
    <h2 class="thanks script">Thank you</h2>
    <p class="invite">祝福收到了，新人確認後就會出現在大螢幕上</p>
    <div class="ig" id="ig">
      <button class="plaque" id="share-ig">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor"/></svg>
        也分享到我的 IG 限動</button>
      <a class="plaque" id="save-file" download hidden>存到手機，再自己發 IG</a>
      <p class="ig-tip" id="ig-tip"></p>
    </div>
    <button class="plaque ghost" id="again">再留一則祝福</button>
  </section>
</main>

<a class="wall-btn" id="wall-btn" href="./" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>
  <span>我也要留祝福</span></a>

<div class="lightbox" id="lightbox" hidden>
  <div class="card">
    <div class="media" id="lb-media"></div>
    <p class="who" id="lb-who"></p>
    <p class="msg" id="lb-msg"></p>
    <button class="link close" id="lb-close">關閉</button>
  </div>
</div>

<script type="module" src="js/guest.js"></script>
</body>
</html>

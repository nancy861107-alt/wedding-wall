<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a040b">
<title>為新人留下祝福</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  main { max-width: 460px; margin: 0 auto; padding: 36px 20px calc(48px + env(safe-area-inset-bottom)); text-align: center; }
  section { animation: rise .6s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .masthead { margin: 8vh 0 34px; }
  .masthead .names { font-size: clamp(3rem, 15vw, 4.2rem); margin: 6px 0 0; }
  .masthead .date { font-family: var(--serif); letter-spacing: .3em; color: var(--gold); margin: 6px 0 0; }
  .invite { font-size: 1.15rem; line-height: 1.9; margin: 28px 0 32px; }
  .invite small { display: block; font-size: .9rem; color: rgba(244,231,201,.7); }
  .actions { display: grid; gap: 14px; }
  .alt { margin-top: 18px; font-size: .92rem; color: rgba(244,231,201,.7); }

  .viewer { aspect-ratio: 3 / 4; margin: 10px 6px 20px; background: #000; }
  .viewer video, .viewer img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .viewer video.mirror { transform: scaleX(-1); }
  .timer {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 2;
    padding: 4px 14px; border-radius: 999px; font: 1.1rem var(--serif);
    background: rgba(26,2,6,.7); color: var(--gold-lit); box-shadow: inset 0 0 0 1px var(--gold);
  }
  .timer.live::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: #e33; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .flip {
    position: absolute; right: 14px; bottom: 14px; z-index: 2; width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--gold); background: rgba(26,2,6,.6); color: var(--gold-lit); font-size: 1.2rem; cursor: pointer;
  }
  .rec-row { display: flex; align-items: center; justify-content: center; gap: 28px; }
  .rec-btn {
    width: 78px; height: 78px; border-radius: 50%; cursor: pointer; border: 0;
    background: radial-gradient(circle, #d3243c 0 46%, transparent 47%), linear-gradient(160deg, #f7e6ae, #a9772f 60%, #e9c874);
    box-shadow: 0 6px 18px rgba(0,0,0,.6);
    transition: background .2s;
  }
  .rec-btn.stop { background: radial-gradient(circle, transparent 0 0), linear-gradient(#d3243c, #d3243c) center / 28px 28px no-repeat, linear-gradient(160deg, #f7e6ae, #a9772f 60%, #e9c874); }
  .hint { font-size: .9rem; color: rgba(244,231,201,.7); margin: 14px 0 0; }
  .two { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }

  form { text-align: left; }
  .thumb { width: 42%; aspect-ratio: 3/4; margin: 0 auto 10px; background: #000; }
  .thumb > video, .thumb > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .count { float: right; font-size: .8rem; color: rgba(244,231,201,.5); }
  form .plaque { margin-top: 26px; }

  .progress { height: 10px; margin: 24px 0 10px; background: rgba(0,0,0,.4); box-shadow: inset 0 0 0 1px var(--gold); }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, #a9772f, var(--gold-lit)); transition: width .2s; }
  .big { font-size: 1.3rem; margin: 18vh 0 6px; }

  .thanks { font-size: clamp(2.8rem, 14vw, 3.8rem); margin: 16vh 0 10px; }
  .error { color: #ffb3b3; background: rgba(120,0,20,.45); border: 1px solid #c55; padding: 10px 14px; margin: 16px 0 0; font-size: .95rem; text-align: left; }

  .petal { position: fixed; top: -30px; z-index: 30; width: 14px; height: 18px; pointer-events: none;
    background: radial-gradient(ellipse at 30% 30%, var(--gold-lit), var(--gold) 60%, #8a5f22);
    border-radius: 60% 0 60% 0; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); opacity: .2; } }
</style>
</head>
<body>
<div class="curtain" id="curtain" aria-hidden="true">
  <div class="valance drape"></div>
  <div class="panel left drape"></div>
  <div class="panel right drape"></div>
</div>

<main>
  <!-- 首頁 -->
  <section id="s-home">
    <header class="masthead">
      <div id="crest-top"></div>
      <h1 class="names script gold-text" data-couple></h1>
      <p class="date" data-date></p>
    </header>
    <p class="invite">今晚，請為我們留下一段祝福<small>影片最長 60 秒，會在會場大螢幕上播出</small></p>
    <div class="actions">
      <button class="plaque" id="go-video">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>
        錄一段祝福影片</button>
      <button class="plaque" id="go-photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
        拍一張照片</button>
    </div>
    <p class="alt">已經拍好了？<button class="link" id="pick-video">從相簿選影片</button></p>
    <input type="file" id="file-photo" accept="image/*" hidden>
    <input type="file" id="file-video" accept="video/*" hidden>
  </section>

  <!-- 錄影 -->
  <section id="s-record" hidden>
    <div class="viewer gilt">
      <video id="cam" class="mirror" playsinline muted autoplay></video>
      <span class="timer" id="timer">0:60</span>
      <button class="flip" id="flip" aria-label="切換前後鏡頭">⟲</button>
    </div>
    <div class="rec-row">
      <button class="link" id="rec-cancel">取消</button>
      <button class="rec-btn" id="rec-btn" aria-label="開始錄影"></button>
      <span style="width:52px"></span>
    </div>
    <p class="hint" id="rec-hint">按下紅色按鈕開始錄，最長 60 秒</p>
    <p class="error" id="cam-error" hidden></p>
  </section>

  <!-- 錄完預覽 -->
  <section id="s-review" hidden>
    <div class="viewer gilt"><video id="review" playsinline controls></video></div>
    <div class="two">
      <button class="plaque ghost" id="redo">重錄</button>
      <button class="plaque" id="use">用這段</button>
    </div>
  </section>

  <!-- 填名字 -->
  <section id="s-details" hidden>
    <div class="thumb gilt" id="thumb"></div>
    <form id="form" novalidate>
      <label for="name">你的名字</label>
      <input id="name" maxlength="20" autocomplete="name" placeholder="例如：大學室友 阿明" required>
      <label for="msg">想對新人說的話 <span class="count" id="count">0 / 60</span></label>
      <textarea id="msg" rows="3" maxlength="60" placeholder="選填，會顯示在大螢幕上"></textarea>
      <p class="error" id="form-error" hidden></p>
      <button class="plaque" type="submit" id="send">送出祝福</button>
      <p style="text-align:center"><button class="link" type="button" id="back-home">重新選擇</button></p>
    </form>
  </section>

  <!-- 上傳中 -->
  <section id="s-sending" hidden>
    <p class="big">正在送出你的祝福…</p>
    <div class="progress"><div id="bar"></div></div>
    <p class="hint">請先不要關掉這個畫面</p>
  </section>

  <!-- 完成 -->
  <section id="s-done" hidden>
    <h2 class="thanks script gold-text">Thank you</h2>
    <p class="invite">祝福收到了<small>新人確認後，就會出現在大螢幕上</small></p>
    <button class="plaque" id="again">再留一則祝福</button>
  </section>
</main>

<script type="module" src="js/guest.js"></script>
</body>
</html>
